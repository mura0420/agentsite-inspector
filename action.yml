name: Agent Site Inspector
description: Check an open agentic website against the Worldwide Agentic Web MVP specification.
branding:
  icon: check-circle
  color: blue
inputs:
  url:
    description: Site base, agent-manifest.json URL or network URL to inspect.
    required: true
  fail-on:
    description: Fail the step on "fail" (default) or also on "warn".
    required: false
    default: fail
  badge:
    description: Optional path to write an SVG badge to.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - shell: bash
      run: |
        args=("${{ inputs.url }}" --fail-on "${{ inputs.fail-on }}")
        if [ -n "${{ inputs.badge }}" ]; then args+=(--badge "${{ inputs.badge }}"); fi
        node "${{ github.action_path }}/cli/inspect.mjs" "${args[@]}"
